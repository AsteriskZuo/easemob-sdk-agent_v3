version: 1
title: 业务包契约
entries:
  - id: bizpkg.contract.overview
    kind: section
    title:
      cn: 契约的作用
    body:
      cn: |
        业务包通过 `contract.json` 向平台声明自己的输入输出契约。
        平台在入口（check-input）与出口（check-output）各设一道机械校验闸门：
        入口拦截缺少必填字段的非法事件，出口拦截不合约的处理结果，
        使主程序 main 可以信任经闸门过滤后的数据形状。
    surfaces:
      - doc: bizpkg/contract
      - console: business-edit.contract
    related:
      see_also: [bizpkg.contract.input.issue-key]
    status: stable
    verify: business/jira-ticket-review/package/contract.json

  - id: bizpkg.contract.input.issue-key
    kind: field
    name: issue_key
    type: string
    required: true
    title:
      cn: 工单号
    body:
      cn: |
        Jira 工单唯一标识，例如 `HIM-24058`。
        check-input 会机械校验其存在性与类型，缺失或类型不符的事件在入口即被拒绝。
    surfaces:
      - doc: bizpkg/contract#input
      - console:
          at: business-edit.contract.input
          display: drawer
    status: stable
    verify: business/jira-ticket-review/package/contract.json
